name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CELERY_DATABASE_URL: ${{ secrets.CELERY_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          {
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'CELERY_DATABASE_URL=%s\n' "$CELERY_DATABASE_URL"
            printf 'REDIS_URL=%s\n' "$REDIS_URL"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY"
            printf 'S3_ENDPOINT_URL=%s\n' "$S3_ENDPOINT_URL"
            printf 'S3_ACCESS_KEY=%s\n' "$S3_ACCESS_KEY"
            printf 'S3_SECRET_KEY=%s\n' "$S3_SECRET_KEY"

            printf 'ALGORITHM=HS256\n'
            printf 'JWT_EXPIRY_TIME=7\n'
            printf 'FRONTEND_URL=http://localhost:5173\n'
            printf 'LLM_MODEL=openai/gpt-oss-20b\n'
            printf 'SUMMARY_THRESHOLD=10\n'
            printf 'CHAT_HISTORY_LIMIT=12\n'
            printf 'LLM_TOP_K=4\n'
            printf 'MAX_UPLOAD_SIZE=20971520\n'
            printf 'SUMMARY_LIMIT=20\n'
            printf 'S3_BUCKET=doclify-docs\n'
            printf 'S3_REGION=us-east-1\n'
          } > .env

      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 300

      - name: Smoke check through nginx
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:3000/api/health

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color > compose.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log

      - name: Tear down
        if: always()
        run: docker compose down -v