x-backend: &backend
  build: ./backend
  image: pdf-backend:dev
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?}@database:5432/pdfdb
    CELERY_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?}@database:5432/pdfdb
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://rustfs:9000
  volumes:
    - chroma:/app/chroma_data
    - hf_cache:/root/.cache/huggingface
  depends_on:
    database: { condition: service_healthy }
    redis: { condition: service_healthy }
    rustfs: { condition: service_started }

services:
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
  backend:
    <<: *backend
    command: sh -c "python -c 'from services.chat.storage import ensure_bucket; ensure_bucket()' && alembic upgrade head && uvicorn server:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
  worker:
    <<: *backend
    command: celery -A celery_app.celery_app worker --pool=solo --loglevel=info
    depends_on:
      backend: { condition: service_healthy }
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: pdfdb
    ports: ["127.0.0.1:15432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdfdb"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: [rustfs_data:/data]

volumes:
  pgdata:
  chroma:
  hf_cache:
  rustfs_data: